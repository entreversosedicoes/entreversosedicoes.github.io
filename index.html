<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre Versos Edições. Nosso site estará no ar em breve.">
  <meta name="theme-color" content="#355587">
  <title>Entre Versos Edições | Em breve</title>

  <style>
    :root {
      --azul: #355587;
      --azul-profundo: #243753;
      --fundo: #f4f6fa;
      --papel: rgba(255, 255, 255, 0.88);
      --texto: #202633;
      --suave: #667085;
      --linha: rgba(63, 96, 144, 0.20);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 16% 14%, rgba(63, 96, 144, 0.18), transparent 30%),
        radial-gradient(circle at 86% 84%, rgba(63, 96, 144, 0.10), transparent 28%),
        linear-gradient(145deg, #fbfcfe 0%, var(--fundo) 100%);
    }

    main {
      position: relative;
      width: min(720px, 100%);
      overflow: hidden;
      padding: 54px 48px 44px;
      text-align: center;
      border: 1px solid var(--linha);
      border-radius: 28px;
      background: var(--papel);
      box-shadow: 0 24px 70px rgba(36, 55, 83, 0.13);
      backdrop-filter: blur(10px);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--azul), transparent);
    }

    .logo {
      display: block;
      width: min(245px, 62vw);
      height: auto;
      margin: 0 auto 24px;
      filter: drop-shadow(0 10px 18px rgba(36, 55, 83, 0.10));
    }

    .separador {
      width: 62px;
      height: 2px;
      margin: 4px auto 28px;
      border-radius: 999px;
      background: var(--azul);
    }

    h1 {
      margin: 0 0 16px;
      color: var(--azul-profundo);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 5vw, 2.55rem);
      font-weight: normal;
      line-height: 1.25;
    }

    p {
      max-width: 520px;
      margin: 0 auto;
      color: var(--suave);
      font-size: 1rem;
      line-height: 1.75;
    }

    .em-breve {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 18px;
      border: 1px solid var(--linha);
      border-radius: 999px;
      color: var(--azul-profundo);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: rgba(63, 96, 144, 0.06);
    }

    footer {
      margin-top: 34px;
      color: rgba(32, 38, 51, 0.50);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      main {
        padding: 42px 23px 34px;
        border-radius: 22px;
      }

      .logo {
        width: min(220px, 72vw);
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="logo-entre-versos.png"
      alt="Logo da Entre Versos Edições"
    >

    <div class="separador"></div>

    <h1>Há novas histórias sendo preparadas.</h1>

    <p>
      Em breve, este será o espaço da Entre Versos Edições:
      literatura, poesia, cordel e projetos que aproximam
      pessoas por meio das palavras.
    </p>

    <div class="em-breve">Site em construção</div>

    <footer>entreversosedicoes.com.br</footer>
  </main>
</body>
</html>
